<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>AI-агент by @womans_bloging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
:root{--bg:#FAF7F8;--surface:#FFFFFF;--ink:#1F1A1D;--muted:#6F666A;--line:#E6DFE2;--accent:#B8175A;--display:"Unbounded","Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:24px 16px}
main{max-width:520px;text-align:center}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h1{font:600 clamp(26px,7vw,38px)/1.15 var(--display);margin:0 0 16px}
p{color:var(--muted);margin:0 0 28px}
a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:16px 28px;border-radius:999px}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">@womans_bloging</p>
  <h1>Свой AI-агент для вашего блога</h1>
  <p>Заказать своего AI-агента можно по ссылке ниже</p>
  <a class="btn" href="https://t.me/womans_bloging" target="_blank" rel="noopener">Заказать AI-агента</a>
</main>
</body>
</html>
